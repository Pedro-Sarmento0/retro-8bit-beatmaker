<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro 8-bit Beamaker</title>
</head>
<body>
    <div>
        <h1> HACK CLUB BEATMAKER</h1>
        <p>Press the keys on your keyboard or click the pads to play!</p>

        <div class="pad-grid">
            <div class="pad" data-key="a" data-sound="kick">
                <span class="key">A</span>
                <span class="sound-name">Kick Drum</span>
            </div>
            <div class="pad" data-key="s" data-sound="laser">
                <span class="key">S</span>
                <span class="sound-name">8-Bit laser</span>
            </div>
            <div class="pad" data-key="d" data-sound="coin">
                <span class="key">D</span>
                <span class="sound-name">Coin</span>
            </div>
            <div class="pad" data-key="f" data-sound="jump">
                <span class="key">F</span>
                <span class="sound-name">Jump</span>
            </div>
            <div class="pad" data-key="g" data-sound="synth1">
                <span class="key">G</span>
                <span class="sound-name">Note C</span>
            </div>
            <div class="pad" data-key="h" data-sound="synth2">
                <span class="key">H</span>
               <span class="sound-name">Note E</span>
            </div>
            <div class="pad" data-key="j" data-sound="synth3">
                <span class="key">J</span>
                <span class="sound-name">Note G</span>
            </div>
            <div class="pad" data-key="k" data-sound="powerup">
                <span class="key">K</span>
                <span class="sound-name">Power-up</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
